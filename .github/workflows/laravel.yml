name: Despliegue de Laravel a Nginx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl

    # 1. Instalar dependencias completas para testing
    - name: Install Dev Dependencies
      run: composer install --no-interaction --prefer-dist

    # 2. Ejecutar las pruebas con APP_KEY asignada temporalmente
    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
        APP_KEY: base64:A28a+94L6I34J4/yL+zM2P/K/f+X+G8S/k+4H5+xL8Y=
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan test

    # 3. Limpiar dependencias dev antes del despliegue a producción
    - name: Optimize Dependencies for Production
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: composer install --no-dev --optimize-autoloader --no-interaction

    # --- PASO DE DESPLIEGUE A NGINX ---
    - name: Deploy to Nginx web root
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        # Crear la carpeta de destino si no existe
        sudo mkdir -p /var/www/tu-proyecto
        sudo chown -R $USER:$USER /var/www/tu-proyecto

        # Copiar repositorio al web root de Nginx
        rsync -avz --exclude='.git' --exclude='storage' . /var/www/tu-proyecto/

        cd /var/www/tu-proyecto

        # Copiar .env guardado en el servidor
        if [ -f /home/grupoidtpy/deploy/.env ]; then
          cp /home/grupoidtpy/deploy/.env /var/www/tu-proyecto/.env
        fi

        # Preparar base de datos SQLite de producción
        mkdir -p database
        touch database/database.sqlite

        # Migraciones y optimizaciones de producción
        php artisan migrate --force
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

        # Permisos finales para Nginx / PHP-FPM (www-data)
        sudo chown -R www-data:www-data /var/www/tu-proyecto
        sudo chmod -R 775 /var/www/tu-proyecto/storage /var/www/tu-proyecto/bootstrap/cache /var/www/tu-proyecto/database
        sudo chmod 664 /var/www/tu-proyecto/database/database.sqlite

        # Recargar PHP-FPM
        sudo systemctl reload php8.4-fpm