name: Despliegue de Laravel a Nginx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan test

    # --- PASO DE DESPLIEGUE A NGINX ---
    - name: Deploy to Nginx web root
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        # 1. Crear el directorio de destino con permisos de sudo si no existe
        sudo mkdir -p /var/www/tu-proyecto
        sudo chown -R $USER:$USER /var/www/tu-proyecto

        # 2. Sincronizar archivos del repositorio
        rsync -avz --exclude='.git' --exclude='storage' . /var/www/tu-proyecto/

        cd /var/www/tu-proyecto

        # 3. Copiar el .env desde /home/grupoidtpy/deploy/.env si existe
        if [ -f /home/grupoidtpy/deploy/.env ]; then
          cp /home/grupoidtpy/deploy/.env /var/www/tu-proyecto/.env
        fi

        # 4. Asegurar existencia de SQLite de producción
        mkdir -p database
        touch database/database.sqlite

        # 5. Ejecutar migraciones y optimizaciones de Laravel
        php artisan migrate --force
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

        # 6. Ajustar permisos finales para Nginx y PHP-FPM (www-data)
        sudo chown -R www-data:www-data /var/www/tu-proyecto
        sudo chmod -R 775 /var/www/tu-proyecto/storage /var/www/tu-proyecto/bootstrap/cache /var/www/tu-proyecto/database
        sudo chmod 664 /var/www/tu-proyecto/database/database.sqlite

        # 7. Recargar PHP-FPM
        sudo systemctl reload php8.4-fpm