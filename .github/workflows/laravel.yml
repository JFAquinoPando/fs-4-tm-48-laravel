name: Deploy Laravel to Nginx

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  deploy:
    runs-on: self-hosted

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.4'
        extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, bcmath, curl

    - name: Copy environment configuration
      run: |
        if [ ! -f /var/www/tu-proyecto/.env ]; then
          cp .env.example /var/www/tu-proyecto/.env
          php artisan key:generate
        fi

    - name: Install Dependencies
      run: composer install --no-dev --optimize-autoloader --no-interaction

    - name: Execute tests
      env:
        DB_CONNECTION: sqlite
        DB_DATABASE: database/database.sqlite
      run: |
        mkdir -p database
        touch database/database.sqlite
        php artisan test

    # --- PASO DE DESPLIEGUE A NGINX ---
    - name: Deploy to Nginx web root
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: |
        # 1. Copiar los archivos actualizados al directorio que sirve Nginx
        rsync -avz --exclude='.git' --exclude='storage' . /var/www/tu-proyecto/

        cd /var/www/tu-proyecto

        # 2. Asegurar existencia de SQLite de producción
        touch database/database.sqlite

        # 3. Ejecutar migraciones en la BD de producción
        php artisan migrate --force

        # 4. Optimizar cachés de Laravel
        php artisan config:cache
        php artisan route:cache
        php artisan view:cache

        # 5. Ajustar permisos para el usuario del servidor web (www-data)
        sudo chown -R www-data:www-data /var/www/tu-proyecto
        sudo chmod -R 775 /var/www/tu-proyecto/storage /var/www/tu-proyecto/bootstrap/cache /var/www/tu-proyecto/database
        sudo chmod 664 /var/www/tu-proyecto/database/database.sqlite

        # 6. Recargar PHP-FPM para limpiar OPcache
        sudo systemctl reload php8.4-fpm